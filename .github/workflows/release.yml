name: Desktop packages

on:
  workflow_dispatch:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

concurrency:
  group: desktop-packages-${{ github.ref }}

env:
  NSH_VERSION: '0.6.1'
  NODE_VERSION: '24.22.1'

jobs:
  macos:
    name: macOS arm64
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install NSH and Node.js
        shell: bash
        run: |
          mkdir -p .tools "$RUNNER_TEMP/desktop-tools"
          cd "$RUNNER_TEMP/desktop-tools"
          nsh_archive=nsh-macos-arm64.tar.gz
          node_archive="node-v${NODE_VERSION}-darwin-arm64.tar.gz"
          curl -fsSL --retry 3 "https://github.com/longbridge/nsh/releases/download/v${NSH_VERSION}/$nsh_archive" -o "$nsh_archive"
          curl -fsSL --retry 3 "https://nodejs.org/dist/v${NODE_VERSION}/$node_archive" -o "$node_archive"
          shasum -a 256 -c <<EOF
          ee1aed2a4d111fe90e6cceca4b9d5f834c9e11cfda525f8be984261a329c06de  $nsh_archive
          89c682593d76cd44233fa53b1563264e7de9cbb189cad169135c5b4fadfbc0a7  $node_archive
          EOF
          tar -xzf "$nsh_archive" -C "$GITHUB_WORKSPACE/.tools"
          tar -xzf "$node_archive"
          printf '%s\n' "$PWD/node-v${NODE_VERSION}-darwin-arm64/bin" >> "$GITHUB_PATH"

      - name: Package macOS app
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            test "$GITHUB_REF_NAME" = "v$(node -p 'require("./nsh.json").version')"
          fi
          export NSH_RUNTIME="$PWD/.tools/nsh/runtime"
          ./tools/package-macos
          app=$(find .nsh/out -maxdepth 2 -type d -name '*.app')
          test -d "$app"
          mkdir -p packages
          ditto -c -k --sequesterRsrc --keepParent "$app" packages/hg-drama-nsh-macos-arm64.zip

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-arm64
          path: packages/hg-drama-nsh-macos-arm64.zip
          if-no-files-found: error
          compression-level: 0

  windows:
    name: Windows x64
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install NSH and Node.js
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .tools, "$env:RUNNER_TEMP/desktop-tools" | Out-Null
          Set-Location "$env:RUNNER_TEMP/desktop-tools"
          $nshArchive = 'nsh-windows-x86_64.zip'
          $nodeArchive = "node-v$env:NODE_VERSION-win-x64.zip"
          $archives = @{
            $nshArchive = @{
              Url = "https://github.com/longbridge/nsh/releases/download/v$env:NSH_VERSION/$nshArchive"
              Hash = '7952c84b165e13515bd2ad2787ef22622e49ce88cb8d877825e40b40f3aff4be'
            }
            $nodeArchive = @{
              Url = "https://nodejs.org/dist/v$env:NODE_VERSION/$nodeArchive"
              Hash = 'd2046d28c2c3dcd211ac5145c0bf30e2047ef9dfb306693c8c6e2eccd8b95fa5'
            }
          }
          foreach ($archive in $archives.Keys) {
            curl.exe -fsSL --retry 3 $archives[$archive].Url -o $archive
            if ($LASTEXITCODE -ne 0) { throw "Download failed: $archive" }
            if ((Get-FileHash $archive).Hash -ne $archives[$archive].Hash) {
              throw "SHA-256 mismatch: $archive"
            }
          }
          Expand-Archive $nshArchive "$env:GITHUB_WORKSPACE/.tools"
          Expand-Archive $nodeArchive .

      - name: Package portable Windows app
        shell: powershell
        run: |
          $nodeExe = "$env:RUNNER_TEMP/desktop-tools/node-v$env:NODE_VERSION-win-x64/node.exe"
          $env:NSH_RUNTIME = "$env:GITHUB_WORKSPACE/.tools/nsh/runtime"
          ./tools/package-windows.ps1 -NodeExe $nodeExe
          $zip = Get-ChildItem .nsh/out -Recurse -File -Filter 'hg-drama-nsh-windows-x64.zip'
          if (@($zip).Count -ne 1) { throw 'Expected exactly one Windows ZIP' }
          New-Item -ItemType Directory -Force packages | Out-Null
          Copy-Item -LiteralPath $zip.FullName -Destination packages

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-x64
          path: packages/hg-drama-nsh-windows-x64.zip
          if-no-files-found: error
          compression-level: 0

  publish:
    name: Publish GitHub Release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [macos, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: '*'
          merge-multiple: true
          path: packages

      - name: Publish both packages and checksums
        shell: bash
        working-directory: packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          macos=hg-drama-nsh-macos-arm64.zip
          windows=hg-drama-nsh-windows-x64.zip
          sha256sum "$macos" "$windows" > SHA256SUMS.txt
          gh release create "$TAG" "$macos" "$windows" SHA256SUMS.txt --verify-tag --generate-notes
