name: Desktop packages

on:
  workflow_dispatch:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

concurrency:
  group: desktop-packages-${{ github.ref }}

env:
  NSH_VERSION: '0.7.1'
  RUSTUP_TOOLCHAIN: '1.97.0'

jobs:
  # GitHub 托管 macOS arm64 会因容量抢不到 runner，表现为 cancelled、空 steps、
  # “not acquired by Runner of type hosted”。首次用 macos-15，失败后再走不同池的 macos-latest。
  macos:
    name: macOS arm64
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/package-macos

  macos-retry:
    name: macOS arm64 (retry)
    needs: macos
    if: always() && needs.macos.result != 'success'
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/package-macos

  windows:
    name: Windows x64
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install NSH and Rust
        shell: pwsh
        run: |
          rustup toolchain install $env:RUSTUP_TOOLCHAIN --profile minimal
          if ($LASTEXITCODE -ne 0) { throw 'Rust toolchain installation failed' }
          New-Item -ItemType Directory -Force .tools, "$env:RUNNER_TEMP/desktop-tools" | Out-Null
          Set-Location "$env:RUNNER_TEMP/desktop-tools"
          $archive = 'nsh-windows-x86_64.zip'
          curl.exe -fsSL --retry 3 "https://github.com/longbridge/nsh/releases/download/v$env:NSH_VERSION/$archive" -o $archive
          if ($LASTEXITCODE -ne 0) { throw "Download failed: $archive" }
          if ((Get-FileHash $archive).Hash -ne 'f09aaf5155b0c57213fbda29ce1e82cd973694d33c745f74b94a1a966a673433') {
            throw "SHA-256 mismatch: $archive"
          }
          Expand-Archive $archive "$env:GITHUB_WORKSPACE/.tools"

      - name: Package portable Windows app
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $version = (Get-Content -Raw -Encoding UTF8 nsh.json | ConvertFrom-Json).version
            if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag and app version differ' }
          }
          ./tools/package-windows.ps1 -OutputDir "$env:RUNNER_TEMP/hg-drama-windows"
          New-Item -ItemType Directory -Force packages | Out-Null
          Copy-Item -LiteralPath "$env:RUNNER_TEMP/hg-drama-windows/hg-drama-nsh-windows-x64.zip" -Destination packages

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-x64
          path: packages/hg-drama-nsh-windows-x64.zip
          if-no-files-found: error
          compression-level: 0

  publish:
    name: Publish GitHub Release
    needs: [macos, macos-retry, windows]
    if: >
      always() &&
      github.event_name == 'push' &&
      github.ref_type == 'tag' &&
      needs.windows.result == 'success' &&
      (needs.macos.result == 'success' || needs.macos-retry.result == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: '*'
          merge-multiple: true
          path: packages

      - name: Publish both packages and checksums
        shell: bash
        working-directory: packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          macos=hg-drama-nsh-macos-arm64.zip
          windows=hg-drama-nsh-windows-x64.zip
          sha256sum "$macos" "$windows" > SHA256SUMS.txt
          gh release create "$TAG" "$macos" "$windows" SHA256SUMS.txt --verify-tag --generate-notes
