[package]
name = "hg-drama-native"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "GPL-3.0-only"
publish = false

[dependencies]
aes = "0.8"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
base64 = "0.22"
cipher = "0.4"
ctr = "0.9"
directories = "6"
hex = "0.4"
md-5 = "0.10"
nsh-core = "=0.6.1"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip", "brotli"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["rt", "net", "time", "sync", "macros", "fs"] }
tokio-util = "0.7"
url = "2"

[workspace]
